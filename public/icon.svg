<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Fuselage: nose at top, symmetric teardrop -->
  <path d="M50,8 C54,22 55,38 54,55 L50,63 L46,55 C45,38 46,22 50,8Z" fill="white"/>
  <!-- Main wings: sweep back, span 10–90 -->
  <path d="M46,32 L10,52 L12,59 L46,44Z" fill="white"/>
  <path d="M54,32 L90,52 L88,59 L54,44Z" fill="white"/>
  <!-- Horizontal stabilizers -->
  <path d="M46,18 L26,25 L27,30 L46,24Z" fill="white"/>
  <path d="M54,18 L74,25 L73,30 L54,24Z" fill="white"/>
  <!-- Landing target -->
  <circle cx="50" cy="82" r="10" fill="none" stroke="#FCD34D" stroke-width="2.5"/>
  <circle cx="50" cy="82" r="4" fill="#F87171"/>
  <circle cx="50" cy="82" r="1.8" fill="white"/>
</svg>
